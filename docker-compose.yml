# =============================================================================
# Chicago Crime Data Engineering Pipeline — Docker Compose
#
#   Source CSV -> Airflow -> HDFS Raw -> Spark (DQ) -> HDFS Curated Parquet
#                                                       -> Spark Thrift SQL -> Power BI
#
# Batch-oriented architecture: HDFS is the data lake, Spark does the
# processing, Airflow orchestrates, and the Spark Thrift Server serves SQL to
# Power BI. Kafka is intentionally excluded (batch data, not a stream), and
# PostgreSQL is only used for Airflow's metadata.
#
# Image note: the Spark cluster uses apache/spark:3.5.1 via ./spark/base
# (adds /spark symlink + PATH for the integration test harness), and the
# Airflow image bundles the matching Spark 3.5.1 distribution so
# SparkSubmitOperator can submit from inside the Airflow container.
# =============================================================================
name: bigdata-lab

x-airflow-common-env: &airflow-common-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
  AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
  AIRFLOW__WEBSERVER__SECRET_KEY: "crime-pipeline-secret-key"
  # Spark client config inside the Airflow container
  SPARK_HOME: "/opt/spark"
  JAVA_HOME: "/usr/lib/jvm/java-17-openjdk-amd64"
  HADOOP_CONF_DIR: "/opt/hadoop/conf"
  HADOOP_USER_NAME: "root"
  HDFS_NAMENODE: "hdfs://namenode:9000"
  SPARK_MASTER: "spark://spark-master:7077"

x-airflow-volumes: &airflow-volumes
  - ./airflow/dags:/opt/airflow/dags
  - ./airflow/logs:/opt/airflow/logs
  - ./airflow/plugins:/opt/airflow/plugins
  - ./data:/opt/airflow/data
  - ./spark/apps:/opt/spark-apps
  - ./hadoop-conf:/opt/hadoop/conf:ro

networks:
  bigdata-net:
    name: bigdata-net

volumes:
  namenode_data:
  datanode_data:
  postgres_data:

services:
  # -------------------------------------------------------------------------
  # Airflow metadata database (only Airflow tables live here — no data
  # warehouse, the curated data stays on HDFS and is served by Spark Thrift)
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG}
    container_name: airflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [bigdata-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # -------------------------------------------------------------------------
  # Airflow (LocalExecutor: one init container + webserver + scheduler)
  # -------------------------------------------------------------------------
  airflow-init:
    build:
      context: ./airflow/docker
      args:
        AIRFLOW_BASE_IMAGE: ${AIRFLOW_BASE_IMAGE}
    image: bigdata-lab-airflow:local
    container_name: airflow-init
    user: "${AIRFLOW_UID}:0"
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *airflow-common-env
    volumes: *airflow-volumes
    networks: [bigdata-net]
    command:
      - bash
      - -c
      - |
        airflow db migrate && \
        (airflow users create \
          --username ${AIRFLOW_ADMIN_USER} \
          --password ${AIRFLOW_ADMIN_PASSWORD} \
          --firstname Admin --lastname User --role Admin \
          --email ${AIRFLOW_ADMIN_EMAIL} \
          || true) && \
        (airflow connections delete spark_default \
          || true) && \
        (airflow connections add spark_default \
          --conn-type spark \
          --conn-host 'spark://spark-master:7077' \
          || true)

  airflow-webserver:
    image: bigdata-lab-airflow:local
    container_name: airflow-webserver
    user: "${AIRFLOW_UID}:0"
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-common-env
    volumes: *airflow-volumes
    networks: [bigdata-net]
    ports:
      - "${AIRFLOW_WEBSERVER_PORT}:8080"
    command: webserver
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  airflow-scheduler:
    image: bigdata-lab-airflow:local
    container_name: airflow-scheduler
    user: "${AIRFLOW_UID}:0"
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-common-env
    volumes: *airflow-volumes
    networks: [bigdata-net]
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $$(hostname) || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s

  # -------------------------------------------------------------------------
  # HDFS (single datanode, replication 1 — sized for a laptop lab)
  # -------------------------------------------------------------------------
  namenode:
    image: bde2020/hadoop-namenode:${HADOOP_IMAGE_TAG}
    container_name: namenode
    hostname: namenode
    restart: unless-stopped
    env_file: ./hadoop/hadoop.env
    environment:
      - CLUSTER_NAME=bigdata-lab
    volumes:
      - namenode_data:/hadoop/dfs/name
    ports:
      - "${NAMENODE_UI_PORT}:9870"
      - "${HDFS_RPC_PORT}:9000"
    networks: [bigdata-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9870/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  datanode:
    image: bde2020/hadoop-datanode:${HADOOP_IMAGE_TAG}
    container_name: datanode
    hostname: datanode
    restart: unless-stopped
    depends_on:
      namenode:
        condition: service_healthy
    env_file: ./hadoop/hadoop.env
    volumes:
      - datanode_data:/hadoop/dfs/data
    ports:
      - "${DATANODE_UI_PORT}:9864"
    networks: [bigdata-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9864/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # -------------------------------------------------------------------------
  # Spark (standalone: 1 master + 1 worker, 4 cores / 4G)
  # -------------------------------------------------------------------------
  spark-master:
    build:
      context: ./spark/base
      args:
        SPARK_IMAGE_TAG: ${SPARK_IMAGE_TAG}
    image: bigdata-lab-spark:local
    container_name: spark-master
    hostname: spark-master
    restart: unless-stopped
    environment:
      HADOOP_USER_NAME: "root"
      HADOOP_CONF_DIR: "/opt/hadoop/conf"
      HDFS_NAMENODE: "hdfs://namenode:9000"
    volumes:
      - ./hadoop-conf:/opt/hadoop/conf:ro
      - ./spark/apps:/opt/spark-apps
    ports:
      - "${SPARK_MASTER_UI_PORT}:8080"
      - "${SPARK_MASTER_PORT}:7077"
    networks: [bigdata-net]
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  spark-worker:
    image: bigdata-lab-spark:local
    container_name: spark-worker
    hostname: spark-worker
    restart: unless-stopped
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      HADOOP_USER_NAME: "root"
      HADOOP_CONF_DIR: "/opt/hadoop/conf"
      HDFS_NAMENODE: "hdfs://namenode:9000"
    volumes:
      - ./hadoop-conf:/opt/hadoop/conf:ro
      - ./spark/apps:/opt/spark-apps
    ports:
      - "${SPARK_WORKER_UI_PORT}:8081"
    networks: [bigdata-net]
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "8"
      - --memory
      - "8G"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # -------------------------------------------------------------------------
  # Spark Thrift Server — the SQL serving layer for Power BI (JDBC :10000)
  # -------------------------------------------------------------------------
  spark-thrift-server:
    image: bigdata-lab-spark:local
    container_name: spark-thrift-server
    hostname: spark-thrift-server
    restart: unless-stopped
    depends_on:
      spark-master:
        condition: service_healthy
      namenode:
        condition: service_healthy
    environment:
      SPARK_NO_DAEMONIZE: "true"
      HADOOP_USER_NAME: "root"
      HADOOP_CONF_DIR: "/opt/hadoop/conf"
      HDFS_NAMENODE: "hdfs://namenode:9000"
    volumes:
      - ./hadoop-conf:/opt/hadoop/conf:ro
      - ./spark/apps:/opt/spark-apps
    ports:
      - "10000:10000"
    networks: [bigdata-net]
    command:
      - /opt/spark/sbin/start-thriftserver.sh
      - --master
      - spark://spark-master:7077
      - --driver-memory
      - "1G"
      - --executor-memory
      - "1G"
      - --executor-cores
      - "1"
      - --conf
      - spark.cores.max=2
      - --conf
      - spark.sql.warehouse.dir=hdfs://namenode:9000/user/hive/warehouse
      - --hiveconf
      - hive.server2.thrift.bind.host=0.0.0.0
      - --hiveconf
      - hive.server2.thrift.port=10000
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('localhost', 10000)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
